<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyHub — AI-Powered B2B Procurement Platform</title>
  <meta name="description" content="SupplyHub: India's AI-powered B2B procurement platform for SMEs. Find suppliers, negotiate prices, and manage deals intelligently." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="design-system.css" />

  <style>
    /* ── App shell layout ── */
    #landing-layout {
      display: none;
      min-height: 100vh;
    }

    #app-layout {
      display: none;
      min-height: 100vh;
    }

    /* Ensure sidebar and main content flex correctly */
    #app-layout {
      flex-direction: row;
    }

    #main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left var(--transition);
    }

    #page-content {
      flex: 1;
      padding: 28px 32px;
      max-width: 1400px;
      width: 100%;
    }

    /* Responsive sidebar collapse */
    @media (max-width: 768px) {
      #main-content {
        margin-left: 0;
      }
      #page-content {
        padding: 16px;
      }
    }

    /* Initial loading state */
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 9999;
      flex-direction: column;
      gap: 16px;
      transition: opacity 0.3s ease;
    }

    #app-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--primary, #0057FF), var(--secondary, #00C2FF));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 22px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      animation: pulse-load 1.2s ease-in-out infinite;
    }

    @keyframes pulse-load {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,87,255,0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(0,87,255,0); }
    }

    .loading-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary, #667085);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="app-loading">
    <div class="loading-logo">S</div>
    <div class="loading-text">Loading SupplyHub…</div>
  </div>

  <!-- ── LANDING / AUTH LAYOUT ── -->
  <!-- Rendered by router for 'landing' and 'auth' pages -->
  <div id="landing-layout"></div>

  <!-- ── APP LAYOUT (Dashboard + inner pages) ── -->
  <div id="app-layout" class="app-layout">

    <!-- Sidebar: built dynamically by buildSidebar() in app.js -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation"></aside>

    <!-- Main content area -->
    <div id="main-content" class="main-content">

      <!-- Topbar: built dynamically by buildTopbar() in app.js -->
      <header id="topbar" class="topbar" role="banner"></header>

      <!-- Dynamic page content: swapped by router -->
      <main id="page-content" class="page-content" role="main"></main>

      
    </div><!-- /main-content -->

  </div><!-- /app-layout -->

  <!-- App JS (defer ensures DOM is ready) -->
  <script src="app.js" defer></script>

  <!-- Remove loading screen once app boots -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Small delay so the router renders landing page before hiding loader
      setTimeout(() => {
        const loader = document.getElementById('app-loading');
        if (loader) loader.classList.add('hidden');
        setTimeout(() => loader && loader.remove(), 400);
      }, 600);
    });
  </script>

</body>
</html>
